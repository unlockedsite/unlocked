<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Wheels · Classic demo</title>
<style>
  html, body, main, ruffle-player { display: block; width: 100%; height: 100%; margin: 0; }
  body { background: #090d15; color: white; font: 16px/1.5 system-ui,sans-serif; }
  #status { position: absolute; inset: 0; display: grid; place-content: center; margin: 0; padding: 1rem; text-align: center; pointer-events: none; }
  #status[hidden] { display: none; }
</style>
<main aria-label="Happy Wheels classic demo"></main>
<p id="status" role="status">Loading the Happy Wheels demo…</p>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
<script>
  async function playDemo() {
    const player = window.RufflePlayer.newest().createPlayer();
    document.querySelector("main").append(player);
    await player.ruffle().load({
      url: "https://xxsibxx.github.io/ruffleembedsetup112/swf/547504_hw_demo202c.swf",
      autoplay: "on", unmuteOverlay: "visible", openUrlMode: "deny", allowScriptAccess: false
    });
    document.querySelector("#status").hidden = true;
    player.focus();
  }
  playDemo().catch(() => {
    document.querySelector("#status").textContent = "The demo couldn’t load. Check your connection and reopen Happy Wheels.";
  });
</script>
</html>
