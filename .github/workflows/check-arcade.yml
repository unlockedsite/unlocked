name: Check arcade player
on:
  push:
    branches: [catalog-preview-import]
    paths: [catalog-review/check-player.py]
permissions:
  contents: write
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test keyboard input, native fullscreen and card pagination
        run: |
          python -m pip install playwright pillow --quiet
          python catalog-review/check-player.py
      - name: Save actual 2048 gameplay preview
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/assets/posters/2048.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture 2048 gameplay for its library card"
          git pull --rebase origin catalog-preview-import
          git push origin HEAD:catalog-preview-import
