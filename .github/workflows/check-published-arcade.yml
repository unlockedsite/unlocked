name: Check published arcade
on:
  push:
    branches: [catalog-preview-import]
    paths: [catalog-review/live.py]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install playwright --quiet
          python catalog-review/live.py
